name: Deploy to Vercel

# [FIX-H4] Use workflow_run to guarantee CI passes before deploy fires.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    # Only run if the triggering CI workflow succeeded and VERCEL_TOKEN secret is configured
    if: ${{ github.event.workflow_run.conclusion == 'success' && secrets.VERCEL_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment information
        run: vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        run: vercel build --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod)
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Log deployment URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"

# ─────────────────────────────────────────────────────────────
# Required GitHub Secrets (repo Settings → Secrets → Actions):
#
#   VERCEL_TOKEN        — vercel.com → Account Settings → Tokens
#   VERCEL_ORG_ID       — .vercel/project.json after `vercel link`
#   VERCEL_PROJECT_ID   — .vercel/project.json after `vercel link`
#
# Required Vercel Environment Variables (Vercel dashboard):
#   DATABASE_URL, SESSION_SECRET, N8N_WEBHOOK_URL, N8N_WEBHOOK_SECRET,
#   SERVER_BASE_URL, NODE_ENV=production
# ─────────────────────────────────────────────────────────────
